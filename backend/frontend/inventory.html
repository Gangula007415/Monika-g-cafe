<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Control</title>

<link rel="stylesheet" href="css/main.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fc;
display:flex;
}

.main-content{
flex:1;
padding:35px;
}

.main-content h1{
font-size:32px;
margin-bottom:30px;
color:#1e293b;
}

.inventory-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:30px;
margin-bottom:30px;
}

.card{
background:#fff;
padding:25px;
border-radius:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.card h3{
margin-bottom:20px;
color:#2563eb;
}

.form-group{
display:flex;
flex-direction:column;
margin-bottom:18px;
}

label{
font-size:14px;
font-weight:600;
margin-bottom:8px;
color:#475569;
}

input{
padding:12px;
border:2px solid #dbeafe;
border-radius:10px;
font-size:15px;
}

input:focus{
outline:none;
border-color:#2563eb;
}

.btn{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#2563eb;
color:#fff;
font-size:15px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.btn:hover{
background:#1d4ed8;
}

.btn-accent{
background:#16a34a;
}

.btn-accent:hover{
background:#15803d;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

thead{
background:#2563eb;
color:#fff;
}

th,td{
padding:15px;
text-align:center;
}

tbody tr:nth-child(even){
background:#f8fafc;
}

tbody tr:hover{
background:#e0f2fe;
}

.alert-badge{
background:#dc2626;
color:white;
padding:6px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.safe-stock{
color:#16a34a;
font-size:16px;
font-weight:600;
padding:20px;
text-align:center;
}

</style>

</head>

<body>

<div class="sidebar" id="sidebar-container"></div>

<main class="main-content">

<h1>📦 Inventory Dashboard</h1>

<div class="inventory-grid">

<div class="card">

<h3>Add Ingredient</h3>

<form id="invForm">

<div class="form-group">
<label>Ingredient Name</label>
<input type="text" id="iname" required>
</div>

<div class="form-group">
<label>Stock Level</label>
<input type="number" step="0.01" id="lvl" required>
</div>

<div class="form-group">
<label>Low Stock Limit</label>
<input type="number" step="0.01" id="thr" required>
</div>

<div class="form-group">
<label>Unit</label>
<input type="text" id="unit" value="kg" required>
</div>

<button class="btn">Save Ingredient</button>

</form>

</div>

<div class="card">

<h3>Restock Ingredient</h3>

<form id="restockForm">

<div class="form-group">
<label>Ingredient ID</label>
<input type="number" id="restockId" required>
</div>

<div class="form-group">
<label>Restock Amount</label>
<input type="number" step="0.01" id="restockAmount" required>
</div>

<button class="btn btn-accent">Restock</button>

</form>

</div>

</div>

<div class="card">

<h3>🚨 Low Stock Alerts</h3>

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Current</th>
<th>Limit</th>
<th>Unit</th>
<th>Status</th>
</tr>
</thead>

<tbody id="alertGrid">
<tr>
<td colspan="6">Loading...</td>
</tr>
</tbody>

</table>

</div>

</main>

<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>

<script>

async function fetchStockAlerts(){

const data=await apiRequest("/inventory/alerts");

const grid=document.getElementById("alertGrid");

if(data && !data.error){

if(data.length===0){

grid.innerHTML=`<tr><td colspan="6" class="safe-stock">✅ All Stocks are Safe</td></tr>`;

}else{

grid.innerHTML=data.map(item=>`

<tr>

<td>${item.ingredient_id}</td>

<td>${item.name}</td>

<td style="color:red;font-weight:bold;">${item.stock_level}</td>

<td>${item.low_stock_threshold}</td>

<td>${item.unit}</td>

<td><span class="alert-badge">LOW</span></td>

</tr>

`).join("");

}

}

}

document.getElementById("invForm").addEventListener("submit",async(e)=>{

e.preventDefault();

const payload={

name:document.getElementById("iname").value,

stock_level:parseFloat(document.getElementById("lvl").value),

low_stock_threshold:parseFloat(document.getElementById("thr").value),

unit:document.getElementById("unit").value,

supplier_id:null

};

const res=await apiRequest("/inventory/ingredients","POST",payload);

if(res && !res.error){

alert("Ingredient Added");

document.getElementById("invForm").reset();

fetchStockAlerts();

}

});

document.getElementById("restockForm").addEventListener("submit",async(e)=>{

e.preventDefault();

const id=parseInt(document.getElementById("restockId").value);

const amount=parseFloat(document.getElementById("restockAmount").value);

const res=await apiRequest(`/inventory/ingredients/${id}/restock?amount=${amount}`,"PATCH");

if(res && !res.error){

alert("Restock Successful");

document.getElementById("restockForm").reset();

fetchStockAlerts();

}

});

fetchStockAlerts();

setInterval(fetchStockAlerts,5000);

</script>

</body>
</html>
