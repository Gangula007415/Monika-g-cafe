<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Monika G Cafe v1.1.0 - Operations Hub</title>

<link rel="stylesheet" href="css/main.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="sidebar" id="sidebar-container"></div>

<main class="main-content">

<div class="top-bar">
    <div class="page-header">
        <h1>☕ Monika G Cafe Operations Hub</h1>
        <p>Live Real-Time Management & Performance Overview</p>
    </div>
    <div class="version-badge">v1.1.0</div>
</div>




<div class="dashboard-grid">



<div class="card revenue">


<h3>
💰 Total Revenue
</h3>


<p id="rev">
Loading...
</p>


</div>





<div class="card orders">


<h3>
🛒 Orders Placed
</h3>


<p id="ord">
Loading...
</p>


</div>






<div class="card customers">


<h3>
👥 Customers
</h3>


<p>
0
</p>


</div>







<div class="card inventory">


<h3>
📦 Inventory Items
</h3>


<p>
0
</p>


</div>




</div>





</main>






<script src="js/api.js"></script>

<script src="js/sidebar.js"></script>



<script>


async function loadMetrics(){


    const res =
    await apiRequest(
        "/reports/sales-summary"
    );



    if(res){


        document
        .getElementById("rev")
        .innerText =
        "₹ " + res.total_revenue;



        document
        .getElementById("ord")
        .innerText =
        res.total_orders;


    }


}




loadMetrics();


</script>



</body>

</html>
