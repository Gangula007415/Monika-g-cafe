<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monika G Cafe v1.1.0 - Customer Feedback</title>

<link rel="stylesheet" href="css/main.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="sidebar" id="sidebar-container"></div>

<main class="main-content">

<div class="top-bar">
    <div class="page-header">
        <h1>💬 Customer Feedback & Reviews</h1>
        <p>Patron Ratings, Testimonials & Comments</p>
    </div>
    <div class="version-badge">v1.1.0</div>
</div>



<div class="feedback-workspace">



<!-- Feedback Form -->

<div class="card">


<h3>Add Customer Review</h3>


<form id="feedForm">



<div class="form-group">

<label>Customer ID</label>

<input 
type="number"
id="fcid"D
placeholder=""
required>

</div>




<div class="form-group">

<label>Rating (1 - 5)</label>

<input 
type="number"
id="rate"
min="1"
max="5"
placeholder=""
required>

</div>




<div class="form-group">

<label>Customer Comments</label>

<textarea
id="comment"
rows="4"
placeholder="">
</textarea>

</div>



<button class="btn" type="submit">

Submit Feedback

</button>



</form>


</div>







<!-- Feedback Table -->

<div class="card">


<h3>Customer Review History</h3>



<div class="table-box">


<table>


<thead>

<tr>

<th>ID</th>
<th>Customer</th>
<th>Rating</th>
<th>Comments</th>
<th>Date</th>

</tr>


</thead>



<tbody id="feedbackGrid">


<tr>

<td colspan="5">

Loading feedback records...

</td>

</tr>


</tbody>



</table>


</div>


</div>




</div>


</main>




<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>



<script>



async function fetchFeedbacks(){


const data = await apiRequest("/feedback/");


const grid=document.getElementById("feedbackGrid");



if(data && !data.error){



if(data.length===0){


grid.innerHTML=`

<tr>

<td colspan="5">

No feedback available.

</td>

</tr>

`;

}


else{


grid.innerHTML=data.map(f=>`


<tr>


<td>
#${f.feedback_id}
</td>


<td>
Customer #${f.customer_id}
</td>


<td class="rating-stars">

${"★".repeat(f.rating)}
${"☆".repeat(5-f.rating)}

</td>



<td class="comment">

"${f.comments || "No comments"}"

</td>



<td>

${new Date(f.created_at).toLocaleDateString()}

</td>



</tr>


`).join("");

}



}

else{


grid.innerHTML=`

<tr>

<td colspan="5">

Failed to load feedback.

</td>

</tr>

`;

}


}





document
.getElementById("feedForm")
.addEventListener("submit",async(e)=>{


e.preventDefault();



const payload={


customer_id:
parseInt(document.getElementById("fcid").value),


rating:
parseInt(document.getElementById("rate").value),


comments:
document.getElementById("comment").value,


order_id:null


};



const res=await apiRequest("/feedback/","POST",payload);



if(res && !res.error){


alert("Feedback saved successfully!");

document.getElementById("feedForm").reset();

fetchFeedbacks();


}

else{


alert("Feedback submission failed.");

}



});



fetchFeedbacks();



</script>



</body>
</html>
