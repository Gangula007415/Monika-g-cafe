<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monika G Cafe - Feedback</title>

<link rel="stylesheet" href="css/main.css">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}


body{
    display:flex;
    background:#f8fafc;
}


.main-content{
    flex:1;
    padding:25px;
}


.main-content h1{
    color:#0f172a;
    font-size:30px;
    margin-bottom:8px;
}


.subtitle{
    color:#64748b;
    margin-bottom:20px;
}



/* Main Layout */

.feedback-workspace{

    display:grid;
    grid-template-columns:320px 1fr;
    gap:20px;
    align-items:start;

}



/* Cards */

.card{

    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);

}


.card h3{

    color:#2563eb;
    margin-bottom:18px;

}



/* Form */

.form-group{

    margin-bottom:14px;

}


label{

    display:block;
    font-size:14px;
    font-weight:600;
    color:#334155;
    margin-bottom:6px;

}


input,
textarea{

    width:100%;
    padding:11px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    resize:none;

}


input:focus,
textarea:focus{

    outline:none;
    border-color:#2563eb;

}



.btn{

    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;

}


.btn:hover{

    background:#1d4ed8;

}




/* Table */


.table-box{

    width:100%;
    overflow-x:auto;

}


table{

    width:100%;
    min-width:600px;
    border-collapse:collapse;

}


thead{

    background:#2563eb;
    color:white;

}


th,
td{

    padding:13px;
    text-align:center;
    border-bottom:1px solid #e2e8f0;

}


tbody tr:hover{

    background:#eff6ff;

}



/* Rating */

.rating-stars{

    color:#f59e0b;
    font-size:18px;
    letter-spacing:2px;

}



.comment{

    color:#475569;
    font-style:italic;

}



/* Responsive */

@media(max-width:900px){

.feedback-workspace{

    grid-template-columns:1fr;

}

}


</style>


</head>



<body>


<div class="sidebar" id="sidebar-container"></div>



<main class="main-content">


<h1>Guest Feedback Center</h1>


<p class="subtitle">
Collect customer reviews, monitor ratings and improve cafe service quality.
</p>



<div class="feedback-workspace">



<!-- Feedback Form -->

<div class="card">


<h3>Add Customer Review</h3>


<form id="feedForm">



<div class="form-group">

<label>Customer ID</label>

<input 
type="number"
id="fcid"D
placeholder=""
required>

</div>




<div class="form-group">

<label>Rating (1 - 5)</label>

<input 
type="number"
id="rate"
min="1"
max="5"
placeholder=""
required>

</div>




<div class="form-group">

<label>Customer Comments</label>

<textarea
id="comment"
rows="4"
placeholder="">
</textarea>

</div>



<button class="btn" type="submit">

Submit Feedback

</button>



</form>


</div>







<!-- Feedback Table -->

<div class="card">


<h3>Customer Review History</h3>



<div class="table-box">


<table>


<thead>

<tr>

<th>ID</th>
<th>Customer</th>
<th>Rating</th>
<th>Comments</th>
<th>Date</th>

</tr>


</thead>



<tbody id="feedbackGrid">


<tr>

<td colspan="5">

Loading feedback records...

</td>

</tr>


</tbody>



</table>


</div>


</div>




</div>


</main>




<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>



<script>



async function fetchFeedbacks(){


const data = await apiRequest("/feedback/");


const grid=document.getElementById("feedbackGrid");



if(data && !data.error){



if(data.length===0){


grid.innerHTML=`

<tr>

<td colspan="5">

No feedback available.

</td>

</tr>

`;

}


else{


grid.innerHTML=data.map(f=>`


<tr>


<td>
#${f.feedback_id}
</td>


<td>
Customer #${f.customer_id}
</td>


<td class="rating-stars">

${"★".repeat(f.rating)}
${"☆".repeat(5-f.rating)}

</td>



<td class="comment">

"${f.comments || "No comments"}"

</td>



<td>

${new Date(f.created_at).toLocaleDateString()}

</td>



</tr>


`).join("");

}



}

else{


grid.innerHTML=`

<tr>

<td colspan="5">

Failed to load feedback.

</td>

</tr>

`;

}


}





document
.getElementById("feedForm")
.addEventListener("submit",async(e)=>{


e.preventDefault();



const payload={


customer_id:
parseInt(document.getElementById("fcid").value),


rating:
parseInt(document.getElementById("rate").value),


comments:
document.getElementById("comment").value,


order_id:null


};



const res=await apiRequest("/feedback/","POST",payload);



if(res && !res.error){


alert("Feedback saved successfully!");

document.getElementById("feedForm").reset();

fetchFeedbacks();


}

else{


alert("Feedback submission failed.");

}



});



fetchFeedbacks();



</script>



</body>
</html>
