<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monika G Cafe v1.1.0 - Table Reservations</title>

<link rel="stylesheet" href="css/main.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="sidebar" id="sidebar-container"></div>

<main class="main-content">

<div class="top-bar">
    <div class="page-header">
        <h1>📅 Table Reservations Desk</h1>
        <p>Bookings Manager & Dining Seating Schedule</p>
    </div>
    <div class="version-badge">v1.1.0</div>
</div>


<h1>Table Reservation Manager</h1>

<p class="subtitle">
Manage customer bookings, table allocation and reservation schedules.
</p>



<div class="reservation-workspace">



<!-- Reservation Form -->

<div class="card">

<h3>Create Reservation</h3>


<form id="resForm">


<div class="form-group">
<label>Customer ID</label>
<input type="number" id="cust" placeholder="" required>
</div>



<div class="form-group">
<label>Table ID</label>
<input type="number" id="tbl" placeholder="" required>
</div>



<div class="form-group">
<label>Number Of Guests</label>
<input type="number" id="guests" min="1" placeholder="" required>
</div>



<div class="form-group">
<label>Reservation Date & Time</label>
<input type="datetime-local" id="time" required>
</div>



<button type="submit" class="btn">
Reserve Table
</button>


</form>


</div>





<!-- Reservation Table -->


<div class="card">


<h3>Active Reservations</h3>


<div class="table-box">


<table>


<thead>

<tr>
<th>Reservation ID</th>
<th>Customer</th>
<th>Table</th>
<th>Guests</th>
<th>Date & Time</th>
<th>Status</th>
</tr>

</thead>



<tbody id="resGrid">

<tr>
<td colspan="6">
Loading reservations...
</td>
</tr>


</tbody>


</table>


</div>


</div>



</div>


</main>



<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>


<script>


async function fetchReservations(){


const data = await apiRequest("/reservations/");

const grid=document.getElementById("resGrid");



if(data && !data.error){



if(data.length===0){


grid.innerHTML=`

<tr>
<td colspan="6">
No reservations available.
</td>
</tr>

`;


}

else{


grid.innerHTML=data.map(r=>`


<tr>

<td>#${r.reservation_id}</td>

<td>Customer #${r.customer_id}</td>

<td>Table #${r.table_id}</td>

<td>${r.number_of_guests} Persons</td>

<td>
${new Date(r.reservation_time).toLocaleString()}
</td>


<td>
<span class="status">
${r.status}
</span>
</td>


</tr>



`).join("");

}



}

else{


grid.innerHTML=`

<tr>
<td colspan="6">
Failed to load reservation data.
</td>
</tr>

`;

}


}





document.getElementById("resForm")
.addEventListener("submit",async(e)=>{


e.preventDefault();



const date=document.getElementById("time").value;


const payload={


customer_id:
parseInt(document.getElementById("cust").value),


table_id:
parseInt(document.getElementById("tbl").value),


number_of_guests:
parseInt(document.getElementById("guests").value),


reservation_time:
date.replace("T"," ")+":00"


};



const res=await apiRequest("/reservations/","POST",payload);



if(res && !res.error){


alert("Reservation created successfully!");

document.getElementById("resForm").reset();

fetchReservations();


}

else{


alert(
"Reservation Error : "+
(typeof res?.detail==="object"
?JSON.stringify(res.detail)
:res?.detail)
);


}



});



fetchReservations();



</script>



</body>
</html>
