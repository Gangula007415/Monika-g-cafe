<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monika G Cafe v1.1.0 - Billing & Invoice</title>
<link rel="stylesheet" href="css/main.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="sidebar" id="sidebar-container"></div>

<main class="main-content">

<div class="top-bar">
    <div class="page-header">
        <h1>🧾 Billing & Invoice Desk</h1>
        <p>Customer Payment Processing & Printable Cafe Bills</p>
    </div>
    <div class="version-badge">v1.1.0</div>
</div>

<div class="card">
    <h3>Generate Invoice</h3>
    <form id="billForm" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem; align-items: end;">
        <div class="form-group" style="margin-bottom: 0;">
            <label for="oid">Order ID</label>
            <input type="number" id="oid" placeholder="e.g. 1" required>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
            <label for="tot">Subtotal (₹)</label>
            <input type="number" id="tot" step="0.01" placeholder="e.g. 250.00" required>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
            <label for="method">Payment Method</label>
            <select id="method">
                <option value="Cash">Cash</option>
                <option value="UPI">UPI</option>
                <option value="Card">Card</option>
            </select>
        </div>
        <div>
            <button class="btn btn-primary" type="submit" style="width: 100%;">Generate Bill 🧾</button>
        </div>
    </form>
</div>

<div class="invoice" id="invoiceContainer">

<div class="invoice-header">

<div>
<h2>☕ MONIKA G CAFE</h2>
<p>Customer Payment Receipt</p>
</div>

<div>
<p id="invDate"></p>
</div>

</div>

<div class="invoice-info">

<p><b>Order ID :</b> <span id="invOrderId"></span></p>

<p><b>Payment :</b> <span id="invMethod"></span></p>

<p><b>Status :</b> <span style="color:green;">PAID</span></p>

</div>

<table>

<thead>

<tr>
<th>Description</th>
<th>Amount</th>
</tr>

</thead>

<tbody>

<tr>
<td>Subtotal</td>
<td id="invSubtotal"></td>
</tr>

<tr>
<td>CGST (2.5%)</td>
<td id="invCgst"></td>
</tr>

<tr>
<td>SGST (2.5%)</td>
<td id="invSgst"></td>
</tr>

</tbody>

</table>

<div class="total">

Grand Total : <span id="invGrandTotal"></span>

</div>

<button class="btn print-btn" onclick="window.print()">

🖨 Print Invoice

</button>

</div>

</div>

<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>

<script>

document.getElementById("billForm").addEventListener("submit",async(e)=>{

e.preventDefault();

const subtotal=parseFloat(document.getElementById("tot").value);

const orderId=parseInt(document.getElementById("oid").value);

const method=document.getElementById("method").value;

const cgst=subtotal*0.025;

const sgst=subtotal*0.025;

const tax=cgst+sgst;

const total=subtotal+tax;

const payload={

order_id:orderId,
subtotal:subtotal,
tax_amount:tax,
discount_applied:0,
total_amount:total,
payment_method:method

};

const res=await apiRequest("/billing/","POST",payload);

if(res && !res.error){

document.getElementById("invOrderId").innerText=orderId;

document.getElementById("invMethod").innerText=method;

document.getElementById("invSubtotal").innerText="₹"+subtotal.toFixed(2);

document.getElementById("invCgst").innerText="₹"+cgst.toFixed(2);

document.getElementById("invSgst").innerText="₹"+sgst.toFixed(2);

document.getElementById("invGrandTotal").innerText="₹"+total.toFixed(2);

document.getElementById("invDate").innerText=new Date().toLocaleString();

document.getElementById("invoiceContainer").style.display="block";

document.getElementById("billForm").reset();

}else{

alert("Billing Failed");

}

});

</script>

</body>
</html>
