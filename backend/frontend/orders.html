<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monika G Cafe v1.1.0 - Order Desk</title>
<link rel="stylesheet" href="css/main.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="sidebar" id="sidebar-container"></div>

<main class="main-content">

<div class="top-bar">
    <div class="page-header">
        <h1>🛒 Order Processing Desk</h1>
        <p>Live Kitchen Ticket Stream & Order Status Tracker</p>
    </div>
    <div class="version-badge">v1.1.0</div>
</div>

<div class="card">
    <h3>Create New Order</h3>
    <form id="orderForm" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem; align-items: end;">
        <div class="form-group" style="margin-bottom: 0;">
            <label for="itemId">Item ID</label>
            <input type="number" id="itemId" placeholder="e.g. 1" required>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
            <label for="qty">Quantity</label>
            <input type="number" id="qty" value="1" min="1" required>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
            <label for="type">Order Type</label>
            <select id="type">
                <option value="Dine-in">Dine-in</option>
                <option value="Takeaway">Takeaway</option>
            </select>
        </div>
        <div>
            <button class="btn btn-primary" type="submit" style="width: 100%;">Place Order 🚀</button>
        </div>
    </form>
</div>

<div class="card">
    <h3>Current Orders Queue</h3>
    <table>
        <thead>
            <tr>
                <th>Order ID</th>
                <th>Type</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="queue"></tbody>
    </table>
</div>

</main>

<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>

<script>

async function loadOrders(){

try{

const list=await apiRequest("/orders/");
const tbody=document.getElementById("queue");

tbody.innerHTML="";

list.forEach(order=>{

const status=(order.order_status||"Pending").toLowerCase();

let badge=status;

let actions="";

if(status==="pending"){
actions=`<button class="action-btn cook" onclick="advanceStatus(${order.order_id},'preparing')">Cook</button>`;
}

else if(status==="preparing"){
actions=`<button class="action-btn complete" onclick="advanceStatus(${order.order_id},'completed')">Complete</button>`;
}

else{
actions=`<span class="closed">Closed</span>`;
}

if(status!="completed" && status!="cancelled"){
actions+=` <button class="action-btn cancel" onclick="advanceStatus(${order.order_id},'cancelled')">Cancel</button>`;
}

tbody.innerHTML+=`
<tr>

<td>#${order.order_id}</td>

<td>${order.order_type}</td>

<td><span class="badge ${badge}">${order.order_status}</span></td>

<td>${actions}</td>

</tr>
`;

});

}catch(err){
console.log(err);
}

}

async function advanceStatus(orderId,nextStatus){

try{

const token=localStorage.getItem("access_token");

const response=await fetch(`${API_URL}/orders/${orderId}/status?new_status=${nextStatus}`,{
method:"PATCH",
headers:{
"Content-Type":"application/json",
"Authorization":token?`Bearer ${token}`:""
}
});

if(response.ok){
loadOrders();
}else{
alert("Unable to update status.");
}

}catch{
alert("Server Error");
}

}

document.getElementById("orderForm").addEventListener("submit",async(e)=>{

e.preventDefault();

const payload={
order_type:document.getElementById("type").value,
items:[
{
item_id:parseInt(document.getElementById("itemId").value),
quantity:parseInt(document.getElementById("qty").value),
unit_price:5.0
}
]
};

await apiRequest("/orders/","POST",payload);

loadOrders();

});

loadOrders();

setInterval(loadOrders,10000);

</script>

</body>
</html>
