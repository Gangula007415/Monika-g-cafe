<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Processing</title>

<link rel="stylesheet" href="css/main.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#edf4ff,#f8fbff);
display:flex;
}

.main-content{
flex:1;
padding:35px;
}

.page-title{
font-size:32px;
font-weight:700;
color:#0f172a;
margin-bottom:25px;
}

.card{
background:#ffffff;
border-radius:18px;
padding:25px;
margin-bottom:30px;
box-shadow:0 15px 35px rgba(0,0,0,.08);
border-left:6px solid #4f46e5;
}

.card h3{
margin-bottom:20px;
color:#374151;
}

#orderForm{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
align-items:end;
}

.form-group{
display:flex;
flex-direction:column;
}

label{
font-size:14px;
font-weight:600;
margin-bottom:8px;
color:#475569;
}

input,select{
padding:12px;
border:2px solid #dbeafe;
border-radius:12px;
font-size:15px;
transition:.3s;
}

input:focus,
select:focus{
outline:none;
border-color:#4f46e5;
box-shadow:0 0 12px rgba(79,70,229,.25);
}

.btn{
background:#4f46e5;
color:#fff;
border:none;
padding:12px 18px;
border-radius:10px;
cursor:pointer;
font-weight:600;
transition:.3s;
}

.btn:hover{
background:#3730a3;
transform:translateY(-2px);
}

table{
width:100%;
border-collapse:collapse;
overflow:hidden;
border-radius:15px;
}

thead{
background:#4f46e5;
color:#fff;
}

th{
padding:16px;
}

td{
padding:15px;
text-align:center;
border-bottom:1px solid #e5e7eb;
}

tbody tr:hover{
background:#eef2ff;
}

.badge{
padding:6px 14px;
border-radius:20px;
font-size:13px;
font-weight:600;
color:white;
display:inline-block;
}

.pending{
background:#f59e0b;
}

.preparing{
background:#2563eb;
}

.completed{
background:#16a34a;
}

.cancelled{
background:#dc2626;
}

.action-btn{
padding:7px 12px;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
margin:2px;
font-size:13px;
font-weight:600;
}

.cook{
background:#2563eb;
}

.complete{
background:#16a34a;
}

.cancel{
background:#dc2626;
}

.closed{
color:#64748b;
font-weight:600;
}

</style>

</head>

<body>

<div class="sidebar" id="sidebar-container"></div>

<main class="main-content">

<h1 class="page-title">🍽 Order Desk</h1>

<div class="card">

<h3>New Order</h3>

<form id="orderForm">

<div class="form-group">
<label>Item ID</label>
<input type="number" id="itemId" required>
</div>

<div class="form-group">
<label>Quantity</label>
<input type="number" id="qty" value="1" required>
</div>

<div class="form-group">
<label>Order Type</label>
<select id="type">
<option>Dine-in</option>
<option>Takeaway</option>
</select>
</div>

<button class="btn" type="submit">Place Order</button>

</form>

</div>

<div class="card">

<h3>Current Orders</h3>

<table>

<thead>
<tr>
<th>Order ID</th>
<th>Type</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="queue"></tbody>

</table>

</div>

</main>

<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>

<script>

async function loadOrders(){

try{

const list=await apiRequest("/orders/");
const tbody=document.getElementById("queue");

tbody.innerHTML="";

list.forEach(order=>{

const status=(order.order_status||"Pending").toLowerCase();

let badge=status;

let actions="";

if(status==="pending"){
actions=`<button class="action-btn cook" onclick="advanceStatus(${order.order_id},'preparing')">Cook</button>`;
}

else if(status==="preparing"){
actions=`<button class="action-btn complete" onclick="advanceStatus(${order.order_id},'completed')">Complete</button>`;
}

else{
actions=`<span class="closed">Closed</span>`;
}

if(status!="completed" && status!="cancelled"){
actions+=` <button class="action-btn cancel" onclick="advanceStatus(${order.order_id},'cancelled')">Cancel</button>`;
}

tbody.innerHTML+=`
<tr>

<td>#${order.order_id}</td>

<td>${order.order_type}</td>

<td><span class="badge ${badge}">${order.order_status}</span></td>

<td>${actions}</td>

</tr>
`;

});

}catch(err){
console.log(err);
}

}

async function advanceStatus(orderId,nextStatus){

try{

const token=localStorage.getItem("access_token");

const response=await fetch(`${API_URL}/orders/${orderId}/status?new_status=${nextStatus}`,{
method:"PATCH",
headers:{
"Content-Type":"application/json",
"Authorization":token?`Bearer ${token}`:""
}
});

if(response.ok){
loadOrders();
}else{
alert("Unable to update status.");
}

}catch{
alert("Server Error");
}

}

document.getElementById("orderForm").addEventListener("submit",async(e)=>{

e.preventDefault();

const payload={
order_type:document.getElementById("type").value,
items:[
{
item_id:parseInt(document.getElementById("itemId").value),
quantity:parseInt(document.getElementById("qty").value),
unit_price:5.0
}
]
};

await apiRequest("/orders/","POST",payload);

loadOrders();

});

loadOrders();

setInterval(loadOrders,10000);

</script>

</body>
</html>
