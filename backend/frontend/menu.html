<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Management</title>

<link rel="stylesheet" href="css/main.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0a0c0f;
    --panel: #10141a;
    --field: #171c24;
    --ink: #e7eaef;
    --ink-soft: #7c8797;
    --accent: #6c8cff;
    --accent-soft: rgba(108,140,255,0.12);
    --ok: #4ee6a8;
    --danger: #ff6b6b;
    --line: #212832;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'IBM Plex Sans', sans-serif;
}

body {
    background:
        radial-gradient(circle at 85% 0%, rgba(108,140,255,0.08), transparent 45%),
        var(--bg);
    display: flex;
    min-height: 100vh;
    color: var(--ink);
}

.sidebar {
    width: 240px;
    background: #0d1117;
    border-right: 1px solid var(--line);
}

.main-content {
    flex: 1;
    padding: 40px 44px;
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.page-header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 1.6rem;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
}

.page-header .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--ok);
    letter-spacing: 0.5px;
}
.status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 8px var(--ok);
    animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

.container {
    display: grid;
    grid-template-columns: 350px 1fr;
    gap: 24px;
}

.card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 26px;
}

.card h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 1.1rem;
    margin-bottom: 20px;
    color: var(--ink);
}

.form-group { margin-bottom: 18px; }

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--ink-soft);
    font-weight: 500;
}

.form-group input {
    width: 100%;
    padding: 12px 14px;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 0.92rem;
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
}

.form-group input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
}

.btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #0a0c0f;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background .15s ease;
}

.btn:hover {
    background: #86a1ff;
}

table {
    width: 100%;
    border-collapse: collapse;
}

thead {
    background: var(--field);
}

th {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--ink-soft);
    font-weight: 500;
}

th, td {
    padding: 14px;
    text-align: left;
    border-bottom: 1px solid var(--line);
}

td {
    font-size: 0.9rem;
    color: var(--ink);
}

tbody tr:hover {
    background: var(--accent-soft);
}

.status {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 600;
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.3px;
}

.available {
    background: rgba(78,230,168,0.14);
    color: var(--ok);
    border: 1px solid rgba(78,230,168,0.3);
}

.unavailable {
    background: rgba(255,107,107,0.14);
    color: var(--danger);
    border: 1px solid rgba(255,107,107,0.3);
}

@media(max-width:900px){
.container{
    grid-template-columns:1fr;
}
}
</style>

</head>

<body>

<div class="sidebar" id="sidebar-container"></div>

<div class="main-content">

<div class="page-header">
<h1>🍽 Menu Management</h1>
<div class="status-row"><span class="status-dot"></span> LIVE CATALOG</div>
</div>

<div class="container">

<div class="card">

<h2>Add New Menu Item</h2>

<form id="menuForm">

<div class="form-group">
<label>Item Name</label>
<input type="text" id="name" required>
</div>

<div class="form-group">
<label>Price (₹)</label>
<input type="number" step="0.01" id="price" required>
</div>

<div class="form-group">
<label>Category ID</label>
<input type="number" id="cat" value="1" required>
</div>

<button class="btn" type="submit">
Save Item
</button>

</form>

</div>

<div class="card">

<h2>Menu Catalog</h2>

<table>

<thead>
<tr>
<th>ID</th>
<th>Item Name</th>
<th>Price</th>
<th>Status</th>
</tr>
</thead>

<tbody id="menuGrid"></tbody>

</table>

</div>

</div>

</div>

<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>

<script>

async function fetchMenu(){

const items = await apiRequest("/menu/");

const grid = document.getElementById("menuGrid");

grid.innerHTML = items.map(i=>`

<tr>

<td>${i.item_id}</td>

<td>${i.name}</td>

<td>₹${Number(i.price).toFixed(2)}</td>

<td>
<span class="status ${i.is_available ? "available":"unavailable"}">
${i.is_available ? "Available":"Out of Stock"}
</span>
</td>

</tr>

`).join("");

}

document.getElementById("menuForm").addEventListener("submit",async(e)=>{

e.preventDefault();

await apiRequest("/menu/","POST",{

name:document.getElementById("name").value,

price:parseFloat(document.getElementById("price").value),

category_id:parseInt(document.getElementById("cat").value)

});

document.getElementById("menuForm").reset();

document.getElementById("cat").value=1;

fetchMenu();

});

fetchMenu();

</script>

</body>
</html>
