<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monika G Cafe v1.1.0 - Menu Catalog</title>

<link rel="stylesheet" href="css/main.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.menu-container {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 2rem;
    align-items: start;
}
@media (max-width: 900px) {
    .menu-container {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>

<div class="sidebar" id="sidebar-container"></div>

<main class="main-content">

<div class="top-bar">
    <div class="page-header" style="margin-bottom: 0;">
        <h1>🍟 Menu Catalog & Catalog Manager</h1>
        <p>Explore, Manage, and Price Cafe Items</p>
    </div>
    <div class="version-badge">v1.1.0</div>
</div>

<div class="menu-container">

<div class="card">

<h2>Add New Menu Item</h2>

<form id="menuForm">

<div class="form-group">
<label>Item Name</label>
<input type="text" id="name" required>
</div>

<div class="form-group">
<label>Price (₹)</label>
<input type="number" step="0.01" id="price" required>
</div>

<div class="form-group">
<label>Category ID</label>
<input type="number" id="cat" value="1" required>
</div>

<button class="btn" type="submit">
Save Item
</button>

</form>

</div>

<div class="card">

<h2>Menu Catalog</h2>

<table>

<thead>
<tr>
<th>ID</th>
<th>Item Name</th>
<th>Price</th>
<th>Status</th>
</tr>
</thead>

<tbody id="menuGrid"></tbody>

</table>

</div>

</div>

</div>

<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>

<script>

async function fetchMenu(){

const items = await apiRequest("/menu/");

const grid = document.getElementById("menuGrid");

grid.innerHTML = items.map(i=>`

<tr>

<td>${i.item_id}</td>

<td>${i.name}</td>

<td>₹${Number(i.price).toFixed(2)}</td>

<td>
<span class="status ${i.is_available ? "available":"unavailable"}">
${i.is_available ? "Available":"Out of Stock"}
</span>
</td>

</tr>

`).join("");

}

document.getElementById("menuForm").addEventListener("submit",async(e)=>{

e.preventDefault();

await apiRequest("/menu/","POST",{

name:document.getElementById("name").value,

price:parseFloat(document.getElementById("price").value),

category_id:parseInt(document.getElementById("cat").value)

});

document.getElementById("menuForm").reset();

document.getElementById("cat").value=1;

fetchMenu();

});

fetchMenu();

</script>

</body>
</html>
